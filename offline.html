<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нет подключения — BARJOK</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f6; --canvas:#ffffff; --ink:#15171c; --ink-2:#565d6b; --ink-3:#8b919d;
    --line:#e6e8ec; --accent:#2f6bed; --accent-ink:#1c4fc4; --emerg:#e5484d;
    --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-image:radial-gradient(rgba(21,32,58,.055) 1px, transparent 1px);background-size:26px 26px;background-position:-13px -13px}
  a{color:inherit;text-decoration:none}
  .logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:40px}
  .logo img{height:28px;width:auto;display:block}
  .ic{width:72px;height:72px;border-radius:50%;background:#fdecea;color:var(--emerg);display:grid;place-items:center;margin:0 auto}
  .ic svg{width:34px;height:34px}
  h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.02em;margin-top:22px;max-width:20ch}
  p{color:var(--ink-2);font-size:15.5px;margin-top:12px;max-width:44ch;line-height:1.55}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;
    border-radius:999px;padding:12px 22px;border:1px solid var(--line);cursor:pointer;transition:.15s;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(47,107,237,.6)}
  .btn.primary:hover{background:var(--accent-ink)}
  .status{margin-top:18px;font-size:13px;font-weight:700;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--emerg)}
  .status.online .dot{background:#1f9e63}
</style>
</head>
<body>
  <a class="logo" href="/"><img src="/barjok.svg" alt="BARJOK"></a>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg></div>
  <h1>Нет подключения к интернету</h1>
  <p>Не получилось загрузить страницу — проверьте связь и попробуйте ещё раз. Как только соединение появится, страница обновится сама.</p>
  <div class="actions">
    <button class="btn primary" onclick="location.reload()">Обновить страницу</button>
  </div>
  <div class="status" id="st"><span class="dot"></span><span id="stTxt">Нет сети</span></div>
  <script>
    function upd(){
      var on = navigator.onLine;
      document.getElementById('st').classList.toggle('online', on);
      document.getElementById('stTxt').textContent = on ? 'Сеть есть — можно обновить страницу' : 'Нет сети';
      if (on) location.reload();
    }
    addEventListener('online', upd); addEventListener('offline', upd); upd();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
