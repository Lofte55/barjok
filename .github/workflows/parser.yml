name: Обновление данных отключений

# Прогоняет парсер по расписанию и коммитит свежий map/data.json в репозиторий,
# чтобы прод на Vercel обновлялся сам (без локальной машины).
# Раньше это делал только локальный LaunchAgent — на проде data.json был статичен.

on:
  schedule:
    # Каждый час (UTC). Аварии выходят в любой момент — час даёт свежесть без
    # заметной нагрузки на чужие сайты (3 docx + 2 HTML-страницы за прогон;
    # Overpass не дёргаем — buildings.json кэшируется, Nominatim тоже кэш).
    # ⚠️ GitHub может пропускать/задерживать cron при высокой загрузке очереди —
    # это нормально, следующий прогон подхватит.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # ручной запуск из вкладки Actions

# Разрешаем job'у коммитить в репозиторий (push через встроенный GITHUB_TOKEN,
# SSH-ключ не нужен — работает независимо от локальной настройки git).
permissions:
  contents: write

# Не запускать параллельно: один прогон за раз, лишние в очереди отменяем.
concurrency:
  group: parser
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # buildings.json (~2.6 МБ адресный реестр OSM) в git не хранится и качается
      # с Overpass. Кэшируем, чтобы не бить Overpass на каждом из 24 прогонов в сутки.
      #
      # ⚠️ Ключ НЕДЕЛЬНЫЙ, а не фиксированный. Раньше здесь стояло
      # barjoq-buildings-pavlodar-v1 — один и тот же ключ навсегда, и Overpass не
      # опрашивался НИ РАЗУ после первого прогона: реестр адресов застыл на дате,
      # когда кэш создали (нашли 04.09.2026 — реестр был от 12.08). Дом, добавленный
      # в OSM после этого, на карту не попадал никогда. Теперь ключ меняется каждый
      # понедельник → раз в неделю кэш промахивается, парсер выкачивает свежий OSM
      # и сохраняет новый кэш. Без restore-keys намеренно: с ними подтянулся бы
      # прошлый кэш и обновление снова не произошло бы.
      - name: Week stamp for cache key
        id: week
        run: echo "stamp=$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OSM buildings cache
        uses: actions/cache@v4
        with:
          path: parser/buildings.json
          key: barjoq-buildings-pavlodar-${{ steps.week.outputs.stamp }}

      # unzip нужен docx.js для распаковки .docx Павлодарэнерго. На ubuntu-latest есть,
      # но подстрахуемся на случай минимального образа.
      - name: Ensure unzip
        run: unzip -v >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y unzip

      - name: Run parser
        # run.sh сам делает бэкап, санити-чек и откат при битых данных —
        # на проде никогда не окажется пустой/битый data.json.
        # CITIZEN_CSV_URL (опц.) — опубликованный CSV Google-таблицы одобренных сообщений жителей.
        # Задать: GitHub → Settings → Secrets and variables → Actions → Variables → CITIZEN_CSV_URL.
        env:
          # приватный JSON-фид одобренных сообщений (Apps Script /exec, doGet). Задать:
          # GitHub → Settings → Secrets and variables → Actions → Variables → CITIZEN_FEED_URL.
          CITIZEN_FEED_URL: ${{ vars.CITIZEN_FEED_URL }}
          # incidents из админки/Decision Engine (Supabase). Задать:
          # GitHub → Settings → Secrets and variables → Actions →
          #   Variables → SUPABASE_URL
          #   Secrets   → SUPABASE_SECRET_KEY
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bash parser/run.sh pavlodar

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "barjoq-bot"
          git config user.email "actions@users.noreply.github.com"
          # geocache.json растёт по мере геокодинга — коммитим, чтобы кэш жил между прогонами.
          # ⚠️ map/addresses.json — адресный справочник для поиска на карте. Раньше его
          # здесь не было: парсер пересобирал файл каждый прогон, но в репозиторий он
          # не попадал, и в браузер уезжала версия от 14.08 — поиск не знал о домах,
          # появившихся в OSM позже. Файл меняется редко (раз в неделю, вместе с
          # обновлением кэша OSM), так что лишних коммитов от него не будет.
          git add map/data.json parser/geocache.json map/addresses.json
          if git diff --staged --quiet; then
            echo "Данные не изменились — коммит не нужен."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): автообновление отключений (Павлодар)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # IndexNow — уведомляем Bing/Яндекс и т.д. о реальном изменении данных,
      # чтобы не ждать планового краула. Шлём ТОЛЬКО когда выше действительно
      # был push (иначе на проде ещё старые данные — уведомление было бы ложным;
      # деплой Vercel по этому push тоже уже должен успеть подхватить изменения
      # к моменту следующего запуска через час).
      - name: Ping IndexNow
        if: steps.commit.outputs.pushed == 'true'
        run: node parser/indexnow-ping.js || echo "IndexNow ping failed (не критично)"
